# App Factory Autopilot — 역량 카탈로그 (SSOT)
#
# Capability Doctor(통합 명세 3.14)가 개발 환경 점검·설치 제안에 사용하는
# 단일 원본입니다. 어댑터가 Provider별(Claude Code / Codex) 설치 명령으로
# 변환합니다.
#
# 등록 원칙 (2026-08-05 사용자 결정):
#   - 설치 제안 대상은 공식/공개 레포에서 확인된 스킬만 등록한다.
#     (사용자 자작 스킬은 공개 레포에 없을 수 있으므로 제외)
#   - 검증 근거는 verified.repo / verified.date 에 기록한다.
#   - Claude Code 내장 스킬은 builtin_skills 로 분류 (설치 불필요, 존재 점검만).
#
# priority:
#   required    — Android 앱 제작 공정 품질에 필수. 부재 시 프리플라이트에서 설치 제안
#   recommended — 있으면 품질·효율 향상. doctor 실행 시 제안
#   optional    — 사용자 선택. 기본 제안 목록에서 접힘 처리
# requires_api_key: true 인 항목은 기본 required 지정 금지 (사용자 선택 시에만 안내)
# condition: 해당 조건의 프로젝트에서만 required로 승격
# guidance_doc: 설치 시 선택 스코프의 관리문서(전역 또는 프로젝트 CLAUDE.md/AGENTS.md)에
#   추가할 사용 지침 한 줄 (통합 명세 3.14 6단계)

version: 2
scopes: [global, project]   # 사용자가 설치 시 선택

skills:
  # ── Google 공식: android/skills 카탈로그 ────────────────────────────
  - id: adaptive
    category: android-ui-design
    purpose: "폰/태블릿/폴더블/데스크톱 적응형 레이아웃 (window size class·멀티페인)"
    priority: required
    install: { method: skills-cli, source: "android/skills", path: "jetpack-compose/adaptive" }
    verified: { repo: "https://github.com/android/skills", date: 2026-08-05 }
    guidance_doc: "적응형 레이아웃 구현·리뷰 시 adaptive 스킬을 사용한다."
  - id: edge-to-edge
    category: android-ui-design
    purpose: "edge-to-edge·system bar·IME inset 적용/문제해결"
    priority: required
    install: { method: skills-cli, source: "android/skills", path: "system/edge-to-edge" }
    verified: { repo: "https://github.com/android/skills", date: 2026-08-05 }
    guidance_doc: "edge-to-edge·인셋 처리 시 edge-to-edge 스킬을 사용한다."
  - id: navigation-3
    category: android-ui-design
    purpose: "Jetpack Navigation 3 구현/마이그레이션"
    priority: required
    install: { method: skills-cli, source: "android/skills", path: "navigation/navigation-3" }
    verified: { repo: "https://github.com/android/skills", date: 2026-08-05 }
    guidance_doc: "내비게이션 구현·마이그레이션 시 navigation-3 스킬을 사용한다."
  - id: agp-9-upgrade
    category: build-migration
    purpose: "AGP 9 업그레이드/마이그레이션"
    priority: recommended
    install: { method: skills-cli, source: "android/skills", path: "build-system/agp/agp-9-upgrade" }
    verified: { repo: "https://github.com/android/skills", date: 2026-08-05 }
    guidance_doc: "AGP 메이저 업그레이드 시 agp-9-upgrade 스킬을 사용한다."
  - id: r8-analyzer
    category: debug-quality-test
    purpose: "R8/ProGuard keep 룰·앱 크기 분석"
    priority: required
    install: { method: skills-cli, source: "android/skills", path: "performance/r8-analyzer" }
    verified: { repo: "https://github.com/android/skills", date: 2026-08-05 }
    guidance_doc: "R8/난독화 문제·앱 크기 분석 시 r8-analyzer 스킬을 사용한다."
  - id: perfetto-trace-analysis
    category: debug-quality-test
    purpose: "Perfetto 트레이스 latency·jank·ANR 근본원인"
    priority: recommended
    install: { method: skills-cli, source: "android/skills", path: "profilers/perfetto-trace-analysis" }
    verified: { repo: "https://github.com/android/skills", date: 2026-08-05 }
    guidance_doc: "성능 트레이스 분석 시 perfetto-trace-analysis 스킬을 사용한다."
  - id: perfetto-sql
    category: debug-quality-test
    purpose: "자연어 → Perfetto SQL 쿼리"
    priority: recommended
    install: { method: skills-cli, source: "android/skills", path: "profilers/perfetto-sql" }
    verified: { repo: "https://github.com/android/skills", date: 2026-08-05 }
    guidance_doc: "Perfetto 트레이스 질의 시 perfetto-sql 스킬을 사용한다."
  - id: android-intent-security
    category: debug-quality-test
    purpose: "Intent 보안 감사 (export·리다이렉션)"
    priority: required
    install: { method: skills-cli, source: "android/skills", path: "security/android-intent-security" }
    verified: { repo: "https://github.com/android/skills", date: 2026-08-05 }
    guidance_doc: "Intent·컴포넌트 노출 보안 점검 시 android-intent-security 스킬을 사용한다."
  - id: testing-setup
    category: debug-quality-test
    purpose: "테스트 전략 수립·인프라 셋업"
    priority: required
    install: { method: skills-cli, source: "android/skills", path: "testing/testing-setup" }
    verified: { repo: "https://github.com/android/skills", date: 2026-08-05 }
    guidance_doc: "테스트 인프라 구성 시 testing-setup 스킬을 사용한다."
  - id: play-billing-library-version-upgrade
    category: monetization-policy
    purpose: "Play Billing Library 버전 업그레이드/구현 지원 (요청명 play-billing의 공식 대응)"
    priority: recommended
    condition: "인앱결제 사용 앱이면 required"
    install: { method: skills-cli, source: "android/skills", path: "play/play-billing-library-version-upgrade" }
    verified: { repo: "https://github.com/android/skills", date: 2026-08-05 }
    guidance_doc: "Play Billing 구현·업그레이드 시 play-billing-library-version-upgrade 스킬을 사용한다."
  - id: play-policy-insights
    category: monetization-policy
    purpose: "Play 정책·데이터 안전성·권한 위생 감사"
    priority: required
    install: { method: skills-cli, source: "android/skills", path: "play/play-policy-insights" }
    verified: { repo: "https://github.com/android/skills", date: 2026-08-05 }
    guidance_doc: "Play 정책·권한 감사 시 play-policy-insights 스킬을 사용한다."

  # ── Google 공식: google/skills (Mobile Ads SDK) ──────────────────────
  - id: google-mobile-ads
    category: monetization-policy
    purpose: "Google Mobile Ads SDK(AdMob)+UMP 동의 구현/디버그 (요청명 admob-agent-skill의 공식 대응)"
    priority: recommended
    condition: "광고 사용 앱이면 required"
    install: { method: skills-cli, source: "google/skills", path: "skills/ads" }
    verified: { repo: "https://github.com/google/skills", date: 2026-08-05, doc: "https://developers.google.com/admob/android/agent-skills" }
    guidance_doc: "AdMob/UMP 구현·디버그 시 google-mobile-ads 스킬을 사용한다."

  # ── 공개 커뮤니티 레포 확인됨 ────────────────────────────────────────
  - id: material-3
    category: android-ui-design
    purpose: "Material Design 3 사양 — theme·color·typography·컴포넌트 스펙 (디자인 1차)"
    priority: required
    install: { method: git, source: "https://github.com/hamen/material-3-skill" }
    verified: { repo: "https://github.com/hamen/material-3-skill", date: 2026-08-05 }
    guidance_doc: "M3 테마·컴포넌트 스펙 확인 시 material-3 스킬을 사용한다."
  - id: compose-expert
    category: android-ui-design
    purpose: "Compose 구현·상태·recomposition·side-effect (구현 1차)"
    priority: required
    install: { method: claude-plugin, source: "aldefy/compose-skill", plugin: "compose-expert" }
    verified: { repo: "https://github.com/aldefy/compose-skill", date: 2026-08-05 }
    guidance_doc: "Compose 구현·recomposition 점검 시 compose-expert 스킬을 사용한다."
  - id: claude-android-ninja
    category: android-code-architecture
    purpose: "앱/모듈 스캐폴딩·MVVM+Hilt·Room·멀티모듈 골격"
    priority: required
    install: { method: git, source: "https://github.com/Drjacky/claude-android-ninja" }
    verified: { repo: "https://github.com/Drjacky/claude-android-ninja", date: 2026-08-05 }
    guidance_doc: "앱/모듈 스캐폴딩 시 claude-android-ninja 스킬을 사용한다."
  - id: android-testing-skills
    category: debug-quality-test
    purpose: "JVM 단위·Compose UI·계측·ADB E2E 테스트 스킬 세트 (요청명 android-testing의 공개 대응)"
    priority: required
    install: { method: git, source: "https://github.com/skydoves/android-testing-skills" }
    verified: { repo: "https://github.com/skydoves/android-testing-skills", date: 2026-08-05 }
    guidance_doc: "테스트 작성 시 android-testing-skills 스킬 세트를 사용한다."

# Claude Code 내장 스킬 — 설치 불필요. doctor는 존재 점검만 수행하고
# 부재 시(다른 Provider 등) 설치 제안 대신 "내장 기능 없음"으로 보고한다.
builtin_skills:
  - { id: dataviz,                   category: artifact-visualization, purpose: "차트/데이터 시각화" }
  - { id: artifact-design,           category: artifact-visualization, purpose: "아티팩트 디자인" }
  - { id: artifact-capabilities,     category: artifact-visualization, purpose: "아티팩트 런타임 기능" }
  - { id: artifact-diagramming,      category: artifact-visualization, purpose: "아티팩트 다이어그램" }
  - { id: update-config,             category: harness-tools, purpose: "settings.json/훅/권한 구성" }
  - { id: keybindings-help,          category: harness-tools, purpose: "키바인딩 커스터마이즈" }
  - { id: loop,                      category: harness-tools, purpose: "주기 실행" }
  - { id: schedule,                  category: harness-tools, purpose: "크론 클라우드 에이전트" }
  - { id: claude-api,                category: harness-tools, purpose: "Claude API/SDK 레퍼런스" }
  - { id: run,                       category: workflow-commands, purpose: "앱 실행/스크린샷" }
  - { id: init,                      category: workflow-commands, purpose: "CLAUDE.md 초기화" }
  - { id: review,                    category: workflow-commands, purpose: "GitHub PR 리뷰" }
  - { id: security-review,           category: workflow-commands, purpose: "보안 리뷰" }
  - { id: simplify,                  category: workflow-commands, purpose: "변경 코드 정리" }
  - { id: fewer-permission-prompts,  category: workflow-commands, purpose: "권한 허용목록 최적화" }

# 공식/공개 레포 미확인으로 카탈로그에서 제외된 항목 (2026-08-05 검증).
# 사용자 로컬 자작 스킬로 추정 — 공개 레포 확인 시 skills 로 승격한다.
# kotlin-expert 는 동명 서브에이전트 정의만 발견되어(스킬 아님) 제외.
excluded_unverified:
  - material3-expert
  - jetpack-compose-expert
  - compose-architecture-expert
  - adaptive-layout-expert
  - android-ui-design
  - design-system-curator
  - qa-scenario-writer
  - android-bug-finder
  - kotlin-expert

mcp_servers:
  - id: mobile-docs
    purpose: "Android/모바일 공식 문서 검색·인덱싱"
    priority: recommended
    requires_api_key: false
  - id: context7
    purpose: "라이브러리 최신 공식 문서 조회"
    priority: recommended
    requires_api_key: false
  - id: mobile-mcp
    purpose: "에뮬레이터/디바이스 조작 (설치·실행·스크린샷)"
    priority: recommended
    requires_api_key: false
    condition: "에뮬레이터 검증 단계에서는 required"
  - id: playwright
    purpose: "브라우저 자동화 (웹 조사·UI 검증)"
    priority: recommended
    requires_api_key: false
  - id: code-review-graph
    purpose: "코드베이스 그래프 기반 탐색·영향 분석·리뷰"
    priority: recommended
    requires_api_key: false
  - id: app-publish
    purpose: "스토어 배포 자동화 (Play Console / App Store Connect)"
    priority: optional
    requires_api_key: true
  - id: play-store-mcp
    purpose: "Play Store 조회·운영"
    priority: optional
    requires_api_key: true
  - id: github
    purpose: "GitHub 저장소·PR·이슈 연동"
    priority: optional
    requires_api_key: true

subagents:
  # Provider가 서브에이전트를 지원하는 경우에만 점검 대상
  - id: android-architecture-reviewer
    purpose: "Android 아키텍처·모듈 경계 리뷰"
    priority: recommended
  - id: security-reviewer
    purpose: "시크릿·인증·저장소·개인정보 리스크 리뷰"
    priority: recommended
  - id: build-failure-debugger
    purpose: "Gradle/Kotlin/Compose/테스트 실패 분석"
    priority: recommended
  - id: gap-analysis-reviewer
    purpose: "목표 대비 구현 상태·프로덕션 준비도 격차 분석"
    priority: recommended
  - id: android-skill-sweep
    purpose: "설치된 Android 스킬 순회 품질 점검"
    priority: recommended
