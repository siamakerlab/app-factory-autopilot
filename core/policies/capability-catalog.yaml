# App Factory Autopilot — 역량 카탈로그 (SSOT)
#
# Capability Doctor(MVP-1.md 3.14)가 개발 환경 점검·설치 제안에 사용하는
# 단일 원본입니다. 어댑터가 Provider별(Claude Code / Codex) 설치 명령으로
# 변환합니다.
#
# priority:
#   required    — Android 앱 제작 공정 품질에 필수. 부재 시 프리플라이트에서 설치 제안
#   recommended — 있으면 품질·효율 향상. doctor 실행 시 제안
#   optional    — 사용자 선택. 기본 제안 목록에서 접힘 처리
# requires_api_key: true 인 항목은 기본 required 지정 금지 (사용자 선택 시에만 안내)
# condition: 해당 조건의 프로젝트에서만 required로 승격
# install: Provider별 설치 방법. 구현 단계에서 확정 (미확정 항목은 source: TBD)

version: 1
scopes: [global, project]   # 사용자가 설치 시 선택

skills:
  # ── Android UI · 디자인 ──────────────────────────────────────────────
  - id: material-3
    category: android-ui-design
    purpose: "Material Design 3 사양 — theme·color·typography·컴포넌트 스펙 (디자인 1차)"
    priority: required
  - id: material3-expert
    category: android-ui-design
    purpose: "M3 컴포넌트·테마·인터랙션 적용/리뷰"
    priority: required
  - id: compose-expert
    category: android-ui-design
    purpose: "Compose 구현·상태·recomposition·side-effect (구현 1차)"
    priority: required
  - id: jetpack-compose-expert
    category: android-ui-design
    purpose: "Compose 구현 경량 변형·@Preview·recomposition-safe"
    priority: required
  - id: compose-architecture-expert
    category: android-ui-design
    purpose: "state hoisting·화면 분해·Compose 아키텍처 구조"
    priority: required
  - id: adaptive
    category: android-ui-design
    purpose: "폰/태블릿/폴더블/데스크톱 적응형 레이아웃 (window size class·멀티페인)"
    priority: required
  - id: adaptive-layout-expert
    category: android-ui-design
    purpose: "적응형 레이아웃 동작 리뷰"
    priority: required
  - id: android-ui-design
    category: android-ui-design
    purpose: "화면 상태·접근성·anti-AI-slop UX 감사"
    priority: required
  - id: design-system-curator
    category: android-ui-design
    purpose: "프로젝트별 디자인 시스템 정합성 관리"
    priority: required
  - id: edge-to-edge
    category: android-ui-design
    purpose: "edge-to-edge·system bar·IME inset 적용/문제해결"
    priority: required
  - id: navigation-3
    category: android-ui-design
    purpose: "Jetpack Navigation 3 구현/마이그레이션"
    priority: required

  # ── Android 코드 · 아키텍처 ──────────────────────────────────────────
  - id: claude-android-ninja
    category: android-code-architecture
    purpose: "앱/모듈 스캐폴딩·MVVM+Hilt·Room·멀티모듈 골격"
    priority: required
  - id: kotlin-expert
    category: android-code-architecture
    purpose: "Kotlin API·nullability·coroutine·Flow 관용 리뷰"
    priority: required

  # ── 디버그 · 품질 · 테스트 ───────────────────────────────────────────
  - id: android-bug-finder
    category: debug-quality-test
    purpose: "버그/크래시/ANR·빌드 실패·R8 릴리즈 버그 진단"
    priority: required
  - id: android-testing
    category: debug-quality-test
    purpose: "JVM 단위·Compose UI·계측 테스트 작성"
    priority: required
  - id: testing-setup
    category: debug-quality-test
    purpose: "테스트 전략 수립·인프라 셋업"
    priority: required
  - id: qa-scenario-writer
    category: debug-quality-test
    purpose: "프로덕션 게이트용 QA 시나리오"
    priority: required
  - id: r8-analyzer
    category: debug-quality-test
    purpose: "R8/ProGuard keep 룰·앱 크기 분석"
    priority: required
  - id: perfetto-trace-analysis
    category: debug-quality-test
    purpose: "Perfetto 트레이스 latency·jank·ANR 근본원인"
    priority: recommended
  - id: perfetto-sql
    category: debug-quality-test
    purpose: "자연어 → Perfetto SQL 쿼리"
    priority: recommended
  - id: android-intent-security
    category: debug-quality-test
    purpose: "Intent 보안 감사 (export·리다이렉션)"
    priority: required

  # ── 빌드 · 마이그레이션 ──────────────────────────────────────────────
  - id: agp-9-upgrade
    category: build-migration
    purpose: "AGP 9 업그레이드/마이그레이션"
    priority: recommended

  # ── 수익화 · 광고 · 결제 · 정책 ──────────────────────────────────────
  - id: admob-agent-skill
    category: monetization-policy
    purpose: "raw AdMob(play-services-ads)+UMP 동의 구현/디버그"
    priority: recommended
    condition: "광고 사용 앱이면 required"
  - id: play-billing
    category: monetization-policy
    purpose: "Play Billing(PBL 9.x) 클라이언트 구현/디버그"
    priority: recommended
    condition: "인앱결제 사용 앱이면 required"
  - id: play-policy-insights
    category: monetization-policy
    purpose: "Play 정책·데이터 안전성·권한 위생 감사"
    priority: required

  # ── Artifact · 시각화 ────────────────────────────────────────────────
  - id: dataviz
    category: artifact-visualization
    purpose: "차트/데이터 시각화"
    priority: optional
  - id: artifact-design
    category: artifact-visualization
    purpose: "아티팩트 디자인"
    priority: optional
  - id: artifact-capabilities
    category: artifact-visualization
    purpose: "아티팩트 런타임 기능"
    priority: optional
  - id: artifact-diagramming
    category: artifact-visualization
    purpose: "아티팩트 다이어그램"
    priority: optional

  # ── Claude Code 하네스 · 도구 ────────────────────────────────────────
  - id: update-config
    category: harness-tools
    purpose: "settings.json/훅/권한 구성"
    priority: optional
    providers: [claude-code]
  - id: keybindings-help
    category: harness-tools
    purpose: "키바인딩 커스터마이즈"
    priority: optional
    providers: [claude-code]
  - id: loop
    category: harness-tools
    purpose: "주기 실행"
    priority: optional
    providers: [claude-code]
  - id: schedule
    category: harness-tools
    purpose: "크론 클라우드 에이전트"
    priority: optional
    providers: [claude-code]
  - id: claude-api
    category: harness-tools
    purpose: "Claude API/SDK 레퍼런스"
    priority: optional
    providers: [claude-code]

  # ── 워크플로 커맨드 ──────────────────────────────────────────────────
  - id: run
    category: workflow-commands
    purpose: "앱 실행/스크린샷"
    priority: recommended
  - id: init
    category: workflow-commands
    purpose: "CLAUDE.md 초기화"
    priority: recommended
  - id: review
    category: workflow-commands
    purpose: "GitHub PR 리뷰"
    priority: recommended
  - id: security-review
    category: workflow-commands
    purpose: "보안 리뷰"
    priority: recommended
  - id: simplify
    category: workflow-commands
    purpose: "변경 코드 정리"
    priority: recommended
  - id: fewer-permission-prompts
    category: workflow-commands
    purpose: "권한 허용목록 최적화"
    priority: recommended

mcp_servers:
  - id: mobile-docs
    purpose: "Android/모바일 공식 문서 검색·인덱싱"
    priority: recommended
    requires_api_key: false
  - id: context7
    purpose: "라이브러리 최신 공식 문서 조회"
    priority: recommended
    requires_api_key: false
  - id: mobile-mcp
    purpose: "에뮬레이터/디바이스 조작 (설치·실행·스크린샷)"
    priority: recommended
    requires_api_key: false
    condition: "에뮬레이터 검증 단계에서는 required"
  - id: playwright
    purpose: "브라우저 자동화 (웹 조사·UI 검증)"
    priority: recommended
    requires_api_key: false
  - id: code-review-graph
    purpose: "코드베이스 그래프 기반 탐색·영향 분석·리뷰"
    priority: recommended
    requires_api_key: false
  - id: app-publish
    purpose: "스토어 배포 자동화 (Play Console / App Store Connect)"
    priority: optional
    requires_api_key: true
  - id: play-store-mcp
    purpose: "Play Store 조회·운영"
    priority: optional
    requires_api_key: true
  - id: github
    purpose: "GitHub 저장소·PR·이슈 연동"
    priority: optional
    requires_api_key: true

subagents:
  # Provider가 서브에이전트를 지원하는 경우에만 점검 대상
  - id: android-architecture-reviewer
    purpose: "Android 아키텍처·모듈 경계 리뷰"
    priority: recommended
  - id: security-reviewer
    purpose: "시크릿·인증·저장소·개인정보 리스크 리뷰"
    priority: recommended
  - id: build-failure-debugger
    purpose: "Gradle/Kotlin/Compose/테스트 실패 분석"
    priority: recommended
  - id: gap-analysis-reviewer
    purpose: "목표 대비 구현 상태·프로덕션 준비도 격차 분석"
    priority: recommended
  - id: android-skill-sweep
    purpose: "설치된 Android 스킬 순회 품질 점검"
    priority: recommended
